# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "YouTube Reader"
slug: "youtube-reader"

runtime: python
entry: "mcp_server.py"

build:
  install: "pip install -r requirements.txt"

start:
  type: stdio
  command: "python"
  args:
    - "mcp_server.py"

bridge:
  mode: stdio
